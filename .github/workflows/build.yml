# Compile le plugin pour Linux, Mac (Intel et Apple Silicon) et Windows avec le Rack SDK.
# - à chaque push / pull request : les paquets .vcvplugin sont disponibles en « artifacts » de l'exécution ;
# - sur un tag vX.Y.Z (git tag v2.0.0 && git push --tags) : ils sont aussi attachés à une release GitHub.
# Cela permet d'essayer les paquets avant de soumettre le plugin à la VCV Library.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: lin-x64,   os: ubuntu-22.04,    shell: bash }
          - { platform: mac-x64,   os: macos-15-intel,  shell: bash }
          - { platform: mac-arm64, os: macos-15,        shell: bash }
          - { platform: win-x64,   os: windows-2022,    shell: 'msys2 {0}' }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Outils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zstd zip unzip

      - name: Outils (macOS)
        if: runner.os == 'macOS'
        run: brew install jq zstd

      - name: Outils (Windows, MSYS2 MinGW 64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            make git tar unzip zip curl zstd jq
            mingw-w64-x86_64-gcc

      - name: Rack SDK
        run: |
          curl -fsSL -o rack-sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          unzip -q rack-sdk.zip

      - name: Compiler le paquet
        run: make -j4 dist RACK_DIR="$PWD/Rack-SDK"

      - uses: actions/upload-artifact@v4
        with:
          name: Hexacorde-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.vcvplugin
          generate_release_notes: true
